<script>
document.addEventListener('DOMContentLoaded', function () {
  function tagClass(label) {
    switch ((label || '').trim().toLowerCase()) {
      case 'academic': return 'tag-academic';
      case 'working paper': return 'tag-working-paper';
      case 'policy': return 'tag-policy';
      case 'code': return 'tag-code';
      case 'blog': return 'tag-blog';
      default: return '';
    }
  }

  function applyTagClasses() {
    document.querySelectorAll('.quarto-listing-category .category').forEach(function (el) {
      var raw = el.getAttribute('data-category');
      var label = raw ? decodeURIComponent(atob(raw)) : '';
      var cls = tagClass(label);
      if (cls && !el.classList.contains(cls)) el.classList.add(cls);
    });
    document.querySelectorAll('.listing-category').forEach(function (el) {
      var cls = tagClass(el.textContent);
      if (cls && !el.classList.contains(cls)) el.classList.add(cls);
    });
  }

  applyTagClasses();

  // Quarto's listing script sorts/rebuilds the category sidebar after this
  // script runs, which can replace nodes and drop the classes just added —
  // an observer re-applies them whenever that happens.
  var categoryBlock = document.querySelector('.quarto-listing-category');
  if (categoryBlock) {
    new MutationObserver(applyTagClasses).observe(categoryBlock, { childList: true, subtree: true });
  }

  // #quarto-margin-sidebar is a CSS Grid item positioned via named grid
  // lines for the desktop margin-note layout. Below Quarto's own 768px
  // breakpoint it hides the sidebar outright (built for TOC content that's
  // fine to drop on mobile) — but ours holds the category filter, which
  // needs to stay usable. Forcing it visible while it's still a grid item
  // just pushes it into a leftover row after all the content (the middle
  // content column is occupied in row one, so a full-width item can't fit
  // there). Moving the node itself into the normal content flow sidesteps
  // that entirely, and is safe on desktop too since grid-area placement
  // there doesn't depend on DOM order.
  function placeMarginSidebar() {
    var sidebar = document.querySelector('#quarto-margin-sidebar');
    var content = document.querySelector('#quarto-document-content');
    if (!sidebar || !content) return;
    if (window.innerWidth <= 767.98 && sidebar.parentElement !== content) {
      content.insertBefore(sidebar, content.firstChild);
    } else if (window.innerWidth > 767.98 && sidebar.parentElement === content) {
      content.parentElement.insertBefore(sidebar, content);
    }
  }
  placeMarginSidebar();
  window.addEventListener('resize', placeMarginSidebar);
});
</script>
